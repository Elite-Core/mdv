<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mdv</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#fff;--fg:#1d1d1f;--muted:#76767c;--faint:#a3a3a8;--border:#e6e6ea;--accent:#0a66c2;--accent-fg:#fff;--hover:#f2f2f4;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1e1e20;--fg:#e7e7ea;--muted:#9a9aa1;--faint:#66666e;--border:#333338;--accent:#7aaefb;--accent-fg:#0d1b33;--hover:#28282c;
}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;cursor:default;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;padding:46px 40px 18px}
header{text-align:center}
.icon{width:72px;height:72px;display:block;margin:0 auto 10px}
h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.02em}
.tag{margin:3px 0 18px;color:var(--muted);font-size:13px}
.actions{display:flex;align-items:center;justify-content:center;gap:12px}
button{font:inherit;font-weight:600;font-size:13px;color:var(--accent-fg);background:var(--accent);border:0;border-radius:7px;padding:7px 16px;cursor:default}
button:hover{filter:brightness(1.08)}
button:active{filter:brightness(.95)}
.hint{color:var(--faint)}
section{flex:1;min-height:0;margin-top:26px;border-top:1px solid var(--border);padding-top:14px;overflow-y:auto}
h4{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px}
li:hover{background:var(--hover)}
li svg{width:16px;height:16px;flex:none;stroke:var(--faint);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
li .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .d{color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;max-width:55%}
.none{color:var(--faint);padding:6px 8px}
footer{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:11px;color:var(--faint)}
footer .sp{flex:1}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
#drop{position:fixed;inset:10px;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,transparent);display:none;place-items:center;font-size:15px;font-weight:600;color:var(--accent);pointer-events:none}
body.drag #drop{display:grid}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="icon" src="icon.png" alt="">
    <h1>mdv</h1>
    <p class="tag">Markdown, rendered clean. Updates as you save.</p>
    <div class="actions">
      <button id="open">Open File…</button>
      <span class="hint">or drop a markdown file here</span>
    </div>
  </header>
  <section>
    <h4>Recent</h4>
    <ul id="recent"></ul>
    <p class="none" id="none" hidden>Files you open will show up here.</p>
  </section>
  <footer>
    <span id="skill"></span>
    <span class="sp"></span>
    <span id="version"></span>
    <a href="#" id="updates">Check for updates</a>
  </footer>
</div>
<div id="drop">Drop to open</div>
<script>
const $ = s => document.querySelector(s);
const post = m => { try { webkit.messageHandlers.home.postMessage(m); } catch (e) {} };
const DOC = '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
$('#open').onclick = () => post({ type: 'open' });
$('#updates').onclick = e => { e.preventDefault(); post({ type: 'updates' }); };
window.home = {
  set(d){
    const ul = $('#recent'); ul.innerHTML = '';
    $('#none').hidden = d.recent.length > 0;
    for (const r of d.recent) {
      const li = document.createElement('li');
      li.innerHTML = DOC + '<span class="n"></span><span class="d"></span>';
      li.querySelector('.n').textContent = r.name; li.querySelector('.d').textContent = r.dir;
      li.title = r.path;
      li.onclick = () => post({ type: 'recent', path: r.path });
      ul.appendChild(li);
    }
    const sk = $('#skill');
    if (!d.claude) sk.textContent = '';
    else if (d.skill) sk.textContent = 'Claude Code skill installed ✓';
    else { sk.innerHTML = '<a href="#">Install the Claude Code skill</a>'; sk.firstChild.onclick = e => { e.preventDefault(); post({ type: 'skill' }); }; }
    $('#version').textContent = 'mdv ' + d.version;
  },
  drag(on){ document.body.classList.toggle('drag', !!on); }
};
</script>
</body>
</html>
