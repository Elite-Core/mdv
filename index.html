<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdv</title>
<script>(function(){try{var t=localStorage.mdvTheme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" id="hl-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" id="hl-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono",Consolas,monospace;
  --bg:#fff;--side:#f7f7f8;--fg:#1d1d1f;--muted:#76767c;--faint:#a3a3a8;
  --border:#e6e6ea;--border-soft:#efeff2;--accent:#0a66c2;
  --code:#f4f4f6;--thead:#fafafb;--hover:#ececef;--active:#e3e9f6;--ok:#34c759;
}
html[data-theme=dark]{
  --bg:#121214;--side:#18181b;--fg:#e7e7ea;--muted:#8f8f96;--faint:#5e5e66;
  --border:#2a2a2f;--border-soft:#222226;--accent:#7aaefb;
  --code:#1c1c21;--thead:#1a1a1f;--hover:#232328;--active:#233049;--ok:#30d158;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased;display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--accent)}

/* ---------- sidebar ---------- */
aside{width:264px;flex:none;height:100vh;position:sticky;top:0;overflow-y:auto;background:var(--side);border-right:1px solid var(--border);padding:14px 10px 28px;display:flex;flex-direction:column;gap:20px}
body.nosb aside{display:none}
.brand{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:2px 10px 0}
.sec h4{margin:0 0 6px;padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sec ul{list-style:none;margin:0;padding:0}
.sec li a{display:block;padding:5px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec li a:hover{background:var(--hover)}
.sec li a.on{background:var(--active)}
.sec li a.sub{color:var(--muted)}
.sec li a small{display:block;color:var(--faint);font-size:11px;margin-top:1px;font-weight:400}
.sec .none{padding:4px 10px;font-size:13px;color:var(--faint)}
@media (max-width:900px){
  aside{position:fixed;left:0;top:0;z-index:20;box-shadow:0 10px 40px rgba(0,0,0,.18)}
}

/* ---------- main ---------- */
main{flex:1;min-width:0}
header{position:sticky;top:0;z-index:5;height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border-soft)}
.ib{width:30px;height:30px;flex:none;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html[data-theme=dark] .moon,html:not([data-theme=dark]) .sun{display:none}
.title{min-width:0;display:flex;flex-direction:column;line-height:1.25}
#name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dir{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
#meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);white-space:nowrap}
#live{display:flex;align-items:center;gap:6px}
#live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent);transition:background .3s}
#live.flash i{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
@media (max-width:640px){#mtime{display:none}}

article{max-width:780px;margin:0 auto;padding:44px 48px 160px}
@media (max-width:640px){article{padding:28px 20px 120px}}
.empty{max-width:440px;margin:16vh auto 0;padding:0 24px;color:var(--muted)}
.empty h2{color:var(--fg);font-weight:600;font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
.empty p{margin:0 0 20px;font-size:14px}
.empty code{font-family:var(--mono);font-size:13px;background:var(--code);padding:3px 7px;border-radius:5px;color:var(--fg)}
.empty .sec{margin-top:28px;margin-left:-10px}
.errbox{border:1px solid var(--border);border-radius:10px;padding:18px 20px;color:var(--muted);font-size:14px}
.errbox b{display:block;color:var(--fg);margin-bottom:4px}
[hidden]{display:none!important}

/* ---------- markdown ---------- */
.md{line-height:1.7;word-wrap:break-word}
.md>*:first-child{margin-top:0!important}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{scroll-margin-top:64px;font-weight:600;line-height:1.25;letter-spacing:-.015em}
.md h1{font-size:2rem;font-weight:650;letter-spacing:-.025em;margin:0 0 .9em;padding-bottom:.35em;border-bottom:1px solid var(--border)}
.md h2{font-size:1.45rem;margin:2.1em 0 .75em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md h3{font-size:1.17rem;margin:1.7em 0 .55em}
.md h4{font-size:1rem;margin:1.5em 0 .45em}
.md h5,.md h6{font-size:.92rem;margin:1.4em 0 .4em;color:var(--muted)}
.md p{margin:0 0 1.1em}
.md a{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.md a:hover{border-bottom-color:currentColor}
.md ul,.md ol{padding-left:1.6em;margin:0 0 1.1em}
.md li{margin:.28em 0}
.md li>p{margin:0 0 .45em}
.md li>ul,.md li>ol{margin:.25em 0 .3em}
.md li:has(>input[type=checkbox]){list-style:none;margin-left:-1.35em}
.md input[type=checkbox]{margin:0 .55em 0 0;vertical-align:-1px;accent-color:var(--accent)}
.md blockquote{margin:0 0 1.1em;padding:.1em 1.1em;border-left:3px solid var(--border);color:var(--muted)}
.md blockquote>:last-child{margin-bottom:0}
.md code{font-family:var(--mono);font-size:.86em;background:var(--code);padding:.17em .42em;border-radius:5px}
.md pre{background:var(--code);border:1px solid var(--border-soft);border-radius:9px;padding:14px 16px;overflow:auto;margin:0 0 1.25em;line-height:1.55}
.md pre code{display:block;background:none!important;padding:0;font-size:.84em}
.hljs{background:transparent!important}
.md table{border-collapse:collapse;max-width:100%;margin:0 0 1.25em;font-size:.94em;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--border);padding:7px 12px;text-align:left;vertical-align:top}
.md th{background:var(--thead);font-weight:600}
.md hr{border:0;border-top:1px solid var(--border);margin:2.2em 0}
.md img{max-width:100%;border-radius:7px}
.md kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:.1em .4em;background:var(--side)}
.md del{color:var(--muted)}
.md strong{font-weight:620}

@media print{aside,header{display:none}article{padding:0;max-width:none}body{display:block}}
</style>
</head>
<body>
<aside>
  <div class="brand">mdv</div>
  <section class="sec"><h4>Outline</h4><ul id="outline"><li class="none">—</li></ul></section>
  <section class="sec"><h4>Recent</h4><ul id="recent"><li class="none">Nothing yet</li></ul></section>
</aside>
<main>
  <header>
    <button class="ib" id="sb" title="Toggle sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg></button>
    <div class="title"><div id="name">mdv</div><div id="dir"></div></div>
    <div class="sp"></div>
    <div id="meta"><span id="mtime"></span><span id="live" hidden><i></i>live</span></div>
    <button class="ib" id="theme" title="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <article id="content" class="md" hidden></article>
  <div id="empty" class="empty" hidden>
    <h2>No file open</h2>
    <p>Pick one from the list, or from a terminal: <code>mdv path/to/file.md</code></p>
    <section class="sec"><h4>Recent</h4><ul id="recent2"></ul></section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const root = document.documentElement;
const file = new URLSearchParams(location.search).get('f');
let mtime = null, firstLoad = true, headingEls = [];

// theme + sidebar prefs
function setTheme(t){ root.dataset.theme = t; try{ localStorage.mdvTheme = t; }catch{} $('#hl-light').disabled = t === 'dark'; $('#hl-dark').disabled = t !== 'dark'; }
setTheme(root.dataset.theme || 'light');
$('#theme').onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
(function(){ let p = null; try{ p = localStorage.mdvSb; }catch{} if (p === '0' || (p == null && innerWidth < 900)) document.body.classList.add('nosb'); })();
$('#sb').onclick = () => { document.body.classList.toggle('nosb'); try{ localStorage.mdvSb = document.body.classList.contains('nosb') ? '0' : '1'; }catch{} };

marked.setOptions({ gfm: true, breaks: false });

// ---------- render ----------
async function load(){
  if (!file) return showEmpty();
  let r; try { r = await fetch('/api/file?path=' + enc(file)); } catch { return showErr('Server unreachable', 'Run mdv again to restart it.'); }
  if (!r.ok) return showErr(r.status === 404 ? 'File not found' : 'Could not open file', await r.text());
  const d = await r.json();
  mtime = d.mtime;
  document.title = d.name;
  $('#name').textContent = d.name; $('#dir').textContent = d.prettyDir;
  const y = scrollY;
  const art = $('#content');
  art.innerHTML = marked.parse(d.content);
  slugHeadings(art); fixAssets(art, d.dir);
  art.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  buildOutline(art);
  $('#empty').hidden = true; art.hidden = false; $('#live').hidden = false;
  if (firstLoad && location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); t && t.scrollIntoView(); }
  else scrollTo(0, y);
  firstLoad = false; tick(); spy(); loadRecent();
}
function showEmpty(){ $('#content').hidden = true; $('#empty').hidden = false; $('#name').textContent = 'mdv'; loadRecent(); }
function showErr(title, msg){ const art = $('#content'); art.hidden = false; $('#empty').hidden = true; art.innerHTML = ''; const b = document.createElement('div'); b.className = 'errbox'; b.innerHTML = '<b></b><span></span>'; b.firstChild.textContent = title; b.lastChild.textContent = msg; art.appendChild(b); $('#name').textContent = file ? file.split('/').pop() : 'mdv'; loadRecent(); }

const slug = s => s.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
function slugHeadings(art){
  const seen = Object.create(null);
  art.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => { let id = slug(h.textContent) || 'section'; if (id in seen) id += '-' + (++seen[id]); else seen[id] = 0; h.id = id; });
}
function fixAssets(art, dir){
  const isAbs = u => /^(https?:|data:|\/|#|mailto:)/i.test(u);
  art.querySelectorAll('img[src]').forEach(img => { const s = img.getAttribute('src'); if (!isAbs(s)) img.src = '/api/raw?path=' + enc(dir + '/' + s); });
  art.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (h.startsWith('#')) { a.onclick = e => { e.preventDefault(); jump(decodeURIComponent(h.slice(1))); }; return; }
    if (!isAbs(h) && /\.(md|markdown|txt)(#.*)?$/i.test(h)) { const [p, hash] = h.split('#'); a.href = '/?f=' + enc(dir + '/' + p) + (hash ? '#' + hash : ''); return; }
    if (/^https?:/i.test(h)) { a.target = '_blank'; a.rel = 'noopener'; }
  });
}
function jump(id){ const t = document.getElementById(id); if (!t) return; t.scrollIntoView({ behavior: 'smooth', block: 'start' }); history.replaceState(null, '', '#' + id); }

function buildOutline(art){
  const hs = [...art.querySelectorAll('h1,h2,h3,h4')];
  const multiH1 = hs.filter(h => h.tagName === 'H1').length > 1;
  headingEls = hs.filter(h => multiH1 || h.tagName !== 'H1');
  const base = multiH1 ? 1 : 2;
  const ul = $('#outline'); ul.innerHTML = '';
  if (!headingEls.length) { ul.innerHTML = '<li class="none">No headings</li>'; return; }
  for (const h of headingEls) {
    const lvl = Math.max(0, +h.tagName[1] - base);
    const li = document.createElement('li'); const a = document.createElement('a');
    a.href = '#' + h.id; a.textContent = h.textContent; a.dataset.id = h.id;
    a.style.paddingLeft = (10 + lvl * 12) + 'px'; if (lvl) a.classList.add('sub');
    a.onclick = e => { e.preventDefault(); jump(h.id); };
    li.appendChild(a); ul.appendChild(li);
  }
}
function spy(){
  let cur = null;
  for (const h of headingEls) { if (h.getBoundingClientRect().top <= 72) cur = h; else break; }
  $('#outline').querySelectorAll('a').forEach(a => a.classList.toggle('on', !!cur && a.dataset.id === cur.id));
}
addEventListener('scroll', spy, { passive: true });

async function loadRecent(){
  let r; try { r = await fetch('/api/recent'); } catch { return; }
  if (!r.ok) return;
  const list = await r.json();
  for (const ul of [$('#recent'), $('#recent2')]) {
    ul.innerHTML = '';
    if (!list.length) { ul.innerHTML = '<li class="none">Nothing yet</li>'; continue; }
    for (const e of list) {
      const li = document.createElement('li'); const a = document.createElement('a');
      a.href = '/?f=' + enc(e.path); a.innerHTML = '<span></span><small></small>';
      a.firstChild.textContent = e.name; a.lastChild.textContent = e.dir;
      if (e.path === file) a.classList.add('on');
      li.appendChild(a); ul.appendChild(li);
    }
  }
}

// ---------- live reload ----------
async function poll(){
  if (!file || mtime == null) return;
  try { const r = await fetch('/api/stat?path=' + enc(file)); if (r.ok) { const s = await r.json(); if (s.mtime !== mtime) { flash(); load(); } } } catch {}
}
function flash(){ const l = $('#live'); l.classList.add('flash'); setTimeout(() => l.classList.remove('flash'), 900); }
function ago(t){ const s = Math.round((Date.now() - t) / 1000); if (s < 45) return 'just now'; const m = Math.round(s / 60); if (m < 60) return m + 'm ago'; const h = Math.round(m / 60); if (h < 24) return h + 'h ago'; return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function tick(){ if (mtime) $('#mtime').textContent = 'updated ' + ago(mtime); }
setInterval(poll, 1500); setInterval(tick, 15000);

load();
</script>
</body>
</html>
